<text x="865.5" y="153.07" text-anchor="middle" font-family="Georgia,serif" font-size="43.46" font-weight="bold" fill="url(#gTitle)" filter="url(#textglow)">C'EST DIEU</text>
<text x="865.5" y="204.09" text-anchor="middle" font-family="Georgia,serif" font-size="43.46" font-weight="bold" fill="url(#gTitle)" filter="url(#textglow)">QUI ÉCRIT</text>
<text x="865.5" y="255.11" text-anchor="middle" font-family="Georgia,serif" font-size="43.46" font-weight="bold" fill="url(#gTitle)" filter="url(#textglow)">L'HISTOIRE</text>
<rect x="631.1800000000001" y="111.5" width="468.66" height="1.13" fill="#D4AF37" opacity="0.5"/>
<rect x="631.1800000000001" y="706.77" width="468.66" height="1.51" fill="#D4AF37"/>
