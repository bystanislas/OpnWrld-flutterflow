<!-- Couverture : AU FINAL, C'EST DIEU QUI ÉCRIT L'HISTOIRE -->
<!-- Auteur     : Djillah Kodjo Stanislas                    -->
<!-- Format     : 14cm x 21cm + tranche 1.6cm + fonds perdus 3mm -->
<!-- Logiciels  : Inkscape (gratuit), Illustrator, Affinity Publisher -->
