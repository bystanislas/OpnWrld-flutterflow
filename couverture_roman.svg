<!-- ══ 4e DE COUVERTURE ══ -->
<rect x="11.34" y="11.34" width="529.13" height="793.7" fill="url(#gBack)"/>
<rect x="41.58" y="56.69" width="468.66" height="1.51" fill="#D4AF37" opacity="0.7"/>
<text x="275.9" y="94.49000000000001" text-anchor="middle" font-family="Georgia,serif" font-size="22.68" font-weight="bold" fill="url(#gTitle)" filter="url(#textglow)">AU FINAL, C'EST DIEU QUI ÉCRIT L'HISTOIRE</text>
<rect x="41.58" y="105.83" width="468.66" height="1.13" fill="#D4AF37" opacity="0.4"/>
<text x="49.14" y="139.84" font-family="Georgia,serif" font-size="12.85" fill="#F5E6C8" font-style="italic">Sara Mensah a grandi dans les rues de Yopougon avec un carnet</text>
<text x="49.14" y="159.49" font-family="Georgia,serif" font-size="12.85" fill="#F5E6C8" font-style="italic">bordeaux et un meilleur ami nommé Élias — celui qui dessinait</text>
<text x="49.14" y="179.14000000000001" font-family="Georgia,serif" font-size="12.85" fill="#F5E6C8" font-style="italic">ses nattes avant même qu'elle sache qu'elle valait la peine</text>
<text x="49.14" y="198.79000000000002" font-family="Georgia,serif" font-size="12.85" fill="#F5E6C8" font-style="italic">d'être dessinée.</text>
<text x="49.14" y="231.67000000000002" font-family="Georgia,serif" font-size="12.85" fill="#F5E6C8" font-style="italic">À vingt-deux ans, elle rencontre Marcus Kouassi dans la lumière</text>
<text x="49.14" y="251.32000000000002" font-family="Georgia,serif" font-size="12.85" fill="#F5E6C8" font-style="italic">de l'Hôtel Ivoire. Il est beau, présent, et il sait exactement</text>
<text x="49.14" y="270.97" font-family="Georgia,serif" font-size="12.85" fill="#F5E6C8" font-style="italic">quoi dire. Elle ne voit pas encore ce que sa première gifle coûtera.</text>
<text x="49.14" y="303.85" font-family="Georgia,serif" font-size="12.85" fill="#F5E6C8" font-style="italic">Six ans plus tard, Sara est assise dans une cuisine de Cocody</text>
<text x="49.14" y="323.5" font-family="Georgia,serif" font-size="12.85" fill="#F5E6C8" font-style="italic">avec un œil tuméfié, une lettre d'adieu pour ses deux filles,</text>
<text x="49.14" y="343.15" font-family="Georgia,serif" font-size="12.85" fill="#F5E6C8" font-style="italic">et plus rien à quoi se raccrocher.</text>
<text x="49.14" y="376.03" font-family="Georgia,serif" font-size="12.85" fill="#F5E6C8" font-style="italic">Sauf peut-être une voisine qui frappe pour du sel.</text>
<text x="49.14" y="395.67999999999995" font-family="Georgia,serif" font-size="12.85" fill="#F5E6C8" font-style="italic">Sauf peut-être une main invisible dans le noir.</text>
<text x="49.14" y="415.3299999999999" font-family="Georgia,serif" font-size="12.85" fill="#F5E6C8" font-style="italic">Sauf peut-être Dieu, qui depuis le début écrit une histoire</text>
<text x="49.14" y="434.9799999999999" font-family="Georgia,serif" font-size="12.85" fill="#F5E6C8" font-style="italic">que Sara n'avait pas su lire.</text>
<rect x="41.58" y="469.7499999999999" width="468.66" height="1.13" fill="#D4AF37" opacity="0.5"/>
<circle cx="79.37" cy="522.6699999999998" r="30.24" fill="#4A2E00" stroke="#D4AF37" stroke-width="1.5"/>
<text x="79.37" y="528.3399999999998" text-anchor="middle" font-family="Georgia,serif" font-size="10.58" fill="#D4AF37" opacity="0.7">Photo</text>
<text x="132.28" y="503.76999999999987" font-family="Georgia,serif" font-size="15.12" font-weight="bold" fill="#D4AF37">Djillah Kodjo Stanislas</text>
<text x="132.28" y="522.6699999999998" font-family="Georgia,serif" font-size="11.34" fill="#F5E6C8" opacity="0.85">est né au Togo, a grandi en Belgique et vit aujourd'hui en</text>
<text x="132.28" y="539.6799999999998" font-family="Georgia,serif" font-size="11.34" fill="#F5E6C8" opacity="0.85">Côte d'Ivoire. Il a grandi en regardant des femmes porter le</text>
<text x="132.28" y="556.6899999999998" font-family="Georgia,serif" font-size="11.34" fill="#F5E6C8" opacity="0.85">monde en silence. Sara Mensah est née de toutes celles qu'il</text>
<text x="132.28" y="573.6999999999998" font-family="Georgia,serif" font-size="11.34" fill="#F5E6C8" opacity="0.85">a connues, aimées de loin.</text>
<text x="132.28" y="600.1599999999999" font-family="Georgia,serif" font-size="11.34" fill="#F5E6C8" opacity="0.85">Ce roman est dédié à toutes les femmes qui ont enduré sans</text>
<text x="132.28" y="617.1699999999998" font-family="Georgia,serif" font-size="11.34" fill="#F5E6C8" opacity="0.85">savoir comment tenir — et qui découvrent, en regardant</text>
<text x="132.28" y="634.1799999999998" font-family="Georgia,serif" font-size="11.34" fill="#F5E6C8" opacity="0.85">derrière elles, qu'une main invisible les tenait depuis</text>
<text x="132.28" y="651.1899999999998" font-family="Georgia,serif" font-size="11.34" fill="#F5E6C8" opacity="0.85">le début. Parce que Dieu a toujours veillé.</text>
<text x="275.9" y="684.09" text-anchor="middle" font-family="Georgia,serif" font-size="14.36" font-style="italic" fill="#D4AF37" opacity="0.9">Ce livre n'est pas une histoire de victime.</text>
<text x="275.9" y="706.77" text-anchor="middle" font-family="Georgia,serif" font-size="14.36" font-style="italic" fill="#D4AF37" opacity="0.9">C'est une histoire de femme debout.</text>
