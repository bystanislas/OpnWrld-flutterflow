<text x="865.5" y="740.79" text-anchor="middle" font-family="Georgia,serif" font-size="14.36" font-style="italic" fill="#F5E6C8" opacity="0.9">Une histoire d'amour, de brisure et de renaissance</text>
<text x="865.5" y="774.8" text-anchor="middle" font-family="Georgia,serif" font-size="20.79" font-weight="bold" fill="#FFFFFF" letter-spacing="2" filter="url(#textglow)">DJILLAH KODJO STANISLAS</text>
